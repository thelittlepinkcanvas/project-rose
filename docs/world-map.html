<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map of Foraville — Project Rose</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-nav"></div>

<main>
  <div class="page-head">
    <p class="eyebrow">World</p>
    <h1>Map of Foraville</h1>
    <p class="sub">Drag to pan<br>tap a pin to learn more</p>
  </div>

  <div class="map-viewport" id="mapViewport">
    <div class="map-inner" id="mapInner">
      <img src="images/map.png" alt="Map of Foraville" draggable="false">

      <a href="location.html?id=lily" class="map-pin" data-label="Lily Ocean" style="top:10%; left:35%;"></a>
      <a href="location.html?id=tulip" class="map-pin" data-label="Tulip Hill" style="top:40%; left:38%;"></a>
      <a href="location.html?id=lavender" class="map-pin" data-label="Lavender District" style="top:65%; left:40%;"></a>
      <a href="location.html?id=lotus" class="map-pin" data-label="Lotus Dock" style="top:33%; left:48%;"></a>
      <a href="location.html?id=bluebell" class="map-pin" data-label="Bluebell District" style="top:60%; left:68%;"></a>
       <a href="location.html?id=sunflower" class="map-pin" data-label="Sunflower District" style="top:50%; left:55%;"></a>
        <a href="location.html?id=periwinkle" class="map-pin" data-label="Periwinkle's Farm" style="top:15%; left:78%;"></a>
    </div>
  </div>
  <div class="map-controls">
    <button class="btn" id="mapLeft">&larr; Pan</button>
    <button class="btn" id="mapRight">Pan &rarr;</button>
  </div>

  <div class="wrap" style="max-width:520px; padding-bottom:3rem; text-align:center;">
    <a href="world.html" class="btn">&larr; Back to World menu</a>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/components.js"></script>
<script src="js/progress.js"></script>
<script src="js/world-map.js"></script>
</body>
</html>
