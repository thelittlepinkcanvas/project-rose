<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Project Rose</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-nav"></div>

<main>
  <div class="page-head">
    <p class="eyebrow">Art &amp; Illustrations</p>
    <h1>Gallery</h1>
  </div>

  <div class="masonry" id="galleryMasonry">
    <div class="masonry-item"><img src="images/book 1 cover.png"></div>
    <div class="masonry-item"><img src="images/book 1 back.png"></div>
    <div class="masonry-item"><img src="images/dance.png"></div>
    <div class="masonry-item"><img src="images/export202601301257016140.png"></div>
    <div class="masonry-item"><img src="images/export202602051640015260.png"></div>
    <div class="masonry-item"><img src="images/export202509121746592660.png"></div>
    <div class="masonry-item"><img src="images/export202502262155533302.png"></div>
    <div class="masonry-item"><img src="images/export202603172310104780.png"></div>
    <div class="masonry-item"><img src="images/export202603172311130520.png"></div>
    <div class="masonry-item"><img src="images/pierce art.png"></div>
  </div>
</main>

<div id="site-footer"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close image">&times;</button>
  <div id="lightboxContent" style="color:var(--mist); font-family:var(--font-mono); font-size:.8rem; text-align:center; max-width:340px;"></div>
</div>

<script src="js/components.js"></script>
<script src="js/progress.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
